services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # 构建代理，留空表示不使用
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
        # pip/uv 镜像源，留空使用官方源
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: resource-manager-backend
    # 只在 compose 内网暴露，由前端容器反代 /api，不占用宿主端口
    expose:
      - "${API_PORT:-8787}"
    volumes:
      - ${NAS_RESOURCE_PATH}:/app/resources
      - ./data/db:/app/data
      - ./data/uploads:/app/uploads
    environment:
      - RESOURCE_DIR=/app/resources
      - UPLOAD_DIR=/app/uploads
      - DATABASE_URL=sqlite:///./data/resources.db
      - API_HOST=0.0.0.0
      - API_PORT=${API_PORT:-8787}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:${API_PORT:-8787}/health")
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
        # 留空 = 使用同源相对路径 /api/v1，端口/域名随便换都不用重新构建
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: resource-manager-frontend
    # 发布端口后飞牛容器面板才会出现「打开」链接，局域网 / 公网都用这个端口
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    restart: unless-stopped
