services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: http://192.168.0.100:7890
        HTTPS_PROXY: http://192.168.0.100:7890
        NO_PROXY: localhost,127.0.0.1
    container_name: resource-manager-backend
    network_mode: host
    volumes:
      - ${NAS_RESOURCE_PATH}:/app/resources
      - ./data/db:/app/data
      - ./data/uploads:/app/uploads
    environment:
      - RESOURCE_DIR=/app/resources
      - UPLOAD_DIR=/app/uploads
      - DATABASE_URL=sqlite:///./data/resources.db
      - API_HOST=0.0.0.0
      - API_PORT=8787
      - FRONTEND_URL=http://192.168.0.222:5173
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: http://192.168.0.100:7890
        HTTPS_PROXY: http://192.168.0.100:7890
        NO_PROXY: localhost,127.0.0.1
        VITE_API_URL: http://192.168.0.222:8787/api/v1
    container_name: resource-manager-frontend
    network_mode: host
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
  upload_data:
