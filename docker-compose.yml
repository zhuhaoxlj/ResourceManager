services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # 构建代理，留空表示不使用
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
        # pip/uv 镜像源，留空使用官方源
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: resource-manager-backend
    network_mode: host
    volumes:
      - ${NAS_RESOURCE_PATH}:/app/resources
      - ./data/db:/app/data
      - ./data/uploads:/app/uploads
    environment:
      - RESOURCE_DIR=/app/resources
      - UPLOAD_DIR=/app/uploads
      - DATABASE_URL=sqlite:///./data/resources.db
      - API_HOST=0.0.0.0
      - API_PORT=${API_PORT:-8787}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:${API_PORT:-8787}/health")
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
        # 浏览器访问后端用的地址，必须是外部可访问的地址
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8787/api/v1}
    container_name: resource-manager-frontend
    network_mode: host
    depends_on:
      - backend
    restart: unless-stopped
