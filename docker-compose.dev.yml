# 开发环境配置 - 支持热重载
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: resource-manager-backend-dev
    network_mode: host
    volumes:
      # 挂载源代码，修改后自动重载
      - ./backend/app:/app/app:rw
      - ${NAS_RESOURCE_PATH}:/app/resources:rw
      - ./data/db:/app/data:rw
      - ./data/uploads:/app/uploads:rw
    environment:
      - RESOURCE_DIR=/app/resources
      - UPLOAD_DIR=/app/uploads
      - DATABASE_URL=sqlite:///./data/resources.db
      - API_HOST=0.0.0.0
      - API_PORT=8787
      - FRONTEND_URL=http://192.168.0.222:5173
      # 开发模式启用热重载
      - RELOAD=true
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8787", "--reload"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        VITE_API_URL: http://192.168.0.222:8787/api/v1
    container_name: resource-manager-frontend-dev
    network_mode: host
    volumes:
      # 挂载源代码，Vite 支持 HMR
      - ./frontend/src:/app/src:rw
      - ./frontend/index.html:/app/index.html:rw
      - ./frontend/package.json:/app/package.json:rw
      - ./frontend/vite.config.ts:/app/vite.config.ts:rw
      - ./frontend/tsconfig.json:/app/tsconfig.json:rw
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json:rw
      - /app/node_modules
      - /app/dist
    environment:
      - VITE_API_URL=http://192.168.0.222:8787/api/v1
    restart: unless-stopped
    command: ["bun", "run", "dev", "--host", "0.0.0.0", "--port", "5173"]

volumes:
  node_modules:
  dist:
